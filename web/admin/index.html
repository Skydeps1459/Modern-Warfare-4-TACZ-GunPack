<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="robots" content="noindex, nofollow">
    <title>分流管理 // Modern Warfare 4 TACZ</title>
    <link rel="stylesheet" href="/admin/styles.css">
  </head>
  <body>
    <main class="admin-shell">
      <header>
        <p class="eyebrow">MW4 // RESTRICTED CONTROL</p>
        <h1>分流管理</h1>
        <p>只有仓库所有者 GitHub 账号可以修改国内蓝奏云分流（含关闭状态与公告）与移动云盘分流链接。</p>
      </header>

      <section id="admin-state" class="panel">
        <p>正在检查 GitHub 登录状态…</p>
      </section>

      <form id="mirror-form" class="panel hidden">
        <div class="account-row">
          <span>已授权：<strong id="account-name">--</strong></span>
          <a href="/auth/logout">退出</a>
        </div>
        <label>
          分流名称
          <input id="mirror-label" maxlength="60" required>
        </label>
        <label class="checkbox-row">
          <input id="mirror-closed" type="checkbox">
          关闭分流（勾选后网页显示关闭按钮与公告，不再跳转链接）
        </label>
        <p class="form-hint">关闭期间也可以更新下方链接与密码：保存后链接会保留在配置里，取消勾选「关闭分流」再保存即可重新启用。</p>
        <label>
          关闭公告（中文）
          <textarea id="mirror-notice" rows="3" maxlength="300"></textarea>
        </label>
        <label>
          关闭公告（英文）
          <textarea id="mirror-notice-en" rows="3" maxlength="600"></textarea>
        </label>
        <label>
          蓝奏云链接（关闭期间可留空或提前维护）
          <input id="mirror-url" type="url" required>
        </label>
        <label>
          分享密码
          <input id="mirror-password" maxlength="32">
        </label>
        <button type="submit">保存并更新网页</button>
        <p id="save-status" role="status"></p>
      </form>

      <form id="mobile-form" class="panel hidden">
        <div class="account-row">
          <span>移动云盘分流</span>
        </div>
        <label>
          分流名称
          <input id="mobile-label" maxlength="60" required>
        </label>
        <label>
          移动云盘链接（留空则网页暂不显示该按钮）
          <input id="mobile-url" type="url" placeholder="https://yun.139.com/...">
        </label>
        <label>
          分享密码（可留空）
          <input id="mobile-password" maxlength="32">
        </label>
        <button type="submit">保存并更新网页</button>
        <p id="mobile-save-status" role="status"></p>
      </form>
    </main>
    <script src="/admin/app.js" type="module"></script>
  </body>
</html>
